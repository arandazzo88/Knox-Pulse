name: Weekly Event Crawler

on:
  schedule:
    - cron: '0 20 * * 3'  # Wednesday 3pm ET (20:00 UTC)
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4 lxml
          playwright install chromium --with-deps

      - name: Run crawler
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python3 crawler/crawl.py

      - name: Commit updated listings
        run: |
          git config user.name "knox-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage the catalog and the inbox (so merged/removed inbox files are
          # committed too), then commit only if anything actually changed.
          git add -A data/listings.json data/inbox
          if git diff --cached --quiet; then
            echo "No new events — nothing to commit."
          else
            git commit -m "Weekly crawl: merge new events into listings.json"
            git push
          fi
